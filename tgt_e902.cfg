# BL808 E902 (LP) core target config
#
# Experimental regular JTAG/RISC-V-DM path for BL808 LP/E902.
#
# On the Ox64 J6 route, LP function 25 exposes a stable board-level TAP ID
# 0x18005b31 once the LP helper has released E902 and moved GPIO6/7/12/13 to
# LP JTAG. A visible TAP is not enough for a useful attach: current hardware
# runs still return all ones for DTMCS, so the harness keeps an LP identity
# check and has a tap-only DTMCS probe for this failure mode.
#
# Default Ox64 J6 wiring:
#   GPIO6  = TMS
#   GPIO12 = TCK
#   GPIO7  = TDO
#   GPIO13 = TDI
#
# Prerequisites:
#   - GPIO 6/7/12/13 func_sel must be set to 25 (LP JTAG experiment)
#   - LP must be released from reset
#   - alternate IO2-5 tests require rewiring the FTDI signals and setting
#     GLB_PARM_CFG0.P7_JTAG_USE_IO_2_5 before switching pads.
#
# Optional environment overrides:
#   BL808_LP_JTAG_KHZ   -> post-reset adapter speed (default: 1000)
#   BL808_LP_IDCODE_IR  -> override RISC-V IDCODE IR value
#   BL808_LP_DTMCS_IR   -> override RISC-V DTMCS IR value
#   BL808_LP_DMI_IR     -> override RISC-V DMI IR value
#
# Switch from M0: run jtag_switch.sh lp

set _CHIPNAME bl808lp
if {[info exists ::env(BL808_LP_HARTID)]} {
    set _HARTID $::env(BL808_LP_HARTID)
} else {
    set _HARTID 0
}
# BL808 LP/E902 TAP observed on the Ox64 after GPIO function 25 mux.
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x18005b31

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME -coreid $_HARTID

# LP executes from the upper 32 KB LP-owned WRAM window.
set _LP_WORKAREA_BASE 0x22057000
set _LP_WORKAREA_SIZE 0x1000
$_TARGETNAME.0 configure -work-area-phys $_LP_WORKAREA_BASE -work-area-size $_LP_WORKAREA_SIZE -work-area-backup 0

echo "Ready for Remote Connections (LP E902 via regular JTAG)"

$_TARGETNAME.0 configure -event reset-assert-pre {
    adapter speed 100
}

$_TARGETNAME.0 configure -event reset-init {
    if {[info exists ::env(BL808_LP_JTAG_KHZ)]} {
        adapter speed $::env(BL808_LP_JTAG_KHZ)
    } else {
        adapter speed 10
    }
}

if {[info exists ::env(BL808_LP_IDCODE_IR)]} {
    riscv set_ir idcode $::env(BL808_LP_IDCODE_IR)
} else {
    riscv set_ir idcode 0x01
}
if {[info exists ::env(BL808_LP_DTMCS_IR)]} {
    riscv set_ir dtmcs $::env(BL808_LP_DTMCS_IR)
} else {
    riscv set_ir dtmcs 0x10
}
if {[info exists ::env(BL808_LP_DMI_IR)]} {
    riscv set_ir dmi $::env(BL808_LP_DMI_IR)
} else {
    riscv set_ir dmi 0x11
}

gdb_memory_map enable
gdb_flash_program disable

# CKLink's LP path appears to use the regular RVDM transport with standard
# DTMCS/DMI IRs, but not a generic "prefer SBA" policy. Keep OpenOCD on the
# lower-risk progbuf/abstract path unless we later prove LP SBA works cleanly.
riscv set_mem_access progbuf abstract
reset_config srst_only srst_pulls_trst
riscv set_command_timeout_sec 8
riscv set_reset_timeout_sec 8

init
