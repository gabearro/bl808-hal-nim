# Pine64 USB JTAG Adapter - FT232HL
# Slow clock variant for marginal D0 JTAG attach experiments.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0

transport select jtag
adapter speed 10

# LP attach happens after the BL808 GPIO mux has already been moved away from
# M0. Do not drive the adapter reset line here: even a short nSRST glitch
# restores the chip's default M0 JTAG mux before LP can be scanned.
ftdi layout_init 0x00d8 0x00db
