# BL808 C906 (D0) core target config
# JTAG ID: 0x10000b6f (T-Head) -- same TAP ID as E907/E902
#
# Prerequisites:
#   - GPIO 6/7/12/13 func_sel must be set to 27 (D0 JTAG)
#   - MM subsystem must be powered on (PDS_CTL2 = 0)
#   - D0 must be released from reset
#
# Switch from M0: run jtag_switch.sh d0

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10000b6f

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME
$_TARGETNAME.0 configure -work-area-phys 0x3EFF0000 -work-area-size 0x10000 -work-area-backup 0

echo "Ready for Remote Connections (D0 C906)"

gdb_memory_map enable
gdb_flash_program disable

riscv set_prefer_sba off
reset_config srst_only srst_pulls_trst
riscv set_command_timeout_sec 15

init
