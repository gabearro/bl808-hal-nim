# BL808 E907 (M0) core target config
# JTAG ID: 0x10000b6f (T-Head)
#
# Prerequisites:
#   - GPIO 6/7/12/13 func_sel must be set to 26 (M0 JTAG)

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10000b6f

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME
$_TARGETNAME.0 configure -work-area-phys 0x40000000 -work-area-size 0x10000 -work-area-backup 0

echo "Ready for Remote Connections"

gdb_memory_map enable
gdb_flash_program disable

riscv set_prefer_sba off
reset_config srst_only srst_nogate
riscv set_command_timeout_sec 10

init
