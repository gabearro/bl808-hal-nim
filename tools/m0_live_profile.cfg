# TAP only. The normal riscv target briefly halts the hart during examine().
jtag newtap bl808m0 cpu -irlen 5 -expected-id 0x10000b6f
init

proc m0_profile_scan {bits value} {
    set reply [drscan bl808m0.cpu $bits [format 0x%llx $value]]
    return [expr 0x$reply]
}

proc m0_profile_dmi {op address value} {
    global m0_profile_bits m0_profile_idle
    set request [expr {($address << 34) | ($value << 2) | $op}]
    m0_profile_scan $m0_profile_bits $request
    runtest $m0_profile_idle
    set reply [m0_profile_scan $m0_profile_bits 0]
    if {($reply & 3) != 0} {
        error [format "DMI transaction failed at 0x%x (status %d)" $address [expr {$reply & 3}]]
    }
    return [expr {($reply >> 2) & 0xffffffff}]
}

proc m0_profile_running {} {
    set status [m0_profile_dmi 1 0x11 0]
    # Require an authenticated, running hart. Do not resume an already halted hart.
    if {($status & 0x980) != 0x880} {
        error [format "M0 is not authenticated and running (DMSTATUS=0x%08x)" $status]
    }
    return $status
}

proc m0_profile_init {} {
    global m0_profile_bits m0_profile_idle
    # A direct ID read works on adapters where discovery's initial scan fails.
    irscan bl808m0.cpu 0x01
    set id [m0_profile_scan 32 0]
    if {$id != 0x10000b6f} {
        error [format "M0 TAP ID mismatch (read 0x%08x)" $id]
    }
    irscan bl808m0.cpu 0x10
    set dtmcs [m0_profile_scan 32 0]
    set abits [expr {($dtmcs >> 4) & 0x3f}]
    if {($dtmcs & 0xc0f) != 1 || $abits < 7 || $abits > 29} {
        error [format "Unsupported DMI transport (DTMCS=0x%08x)" $dtmcs]
    }
    set m0_profile_bits [expr {34 + $abits}]
    set m0_profile_idle [expr {2 + (($dtmcs >> 12) & 7)}]
    irscan bl808m0.cpu 0x11
    # DMACTIVE enables the debug module. Leave reset, halt and resume bits clear.
    if {([m0_profile_dmi 1 0x10 0] & 1) == 0} {
        m0_profile_dmi 2 0x10 1
    }
    set status [m0_profile_running]
    set compid [m0_profile_dmi 1 0x7f 0]
    if {$compid != 0xb6f00001} {
        error [format "Unrecognized T-Head debug component (COMPID=0x%08x)" $compid]
    }
    echo [format "BL808_PROFILE_READY 0x%08x" $status]
}

proc m0_profile_pc {} {
    # XuanTie E907 manual, table 5.3. Command 2 copies the latest branch
    # destination to DATA0. It uses the on-core PC FIFO, with no hart halt.
    m0_profile_dmi 2 0x71 0x02000000
    for {set attempt 0} {$attempt < 10} {incr attempt} {
        set status [m0_profile_dmi 1 0x70 0]
        if {$status & 0xe0000000} {
            error [format "Live PC sampler rejected (CUSTOMCS=0x%08x)" $status]
        }
        if {($status & 0x20000) == 0} {
            set pc [m0_profile_dmi 1 0x04 0]
            m0_profile_running
            echo [format "BL808_PROFILE_PC 0x%08x" $pc]
            return
        }
    }
    error "Live PC sampler remained busy"
}
